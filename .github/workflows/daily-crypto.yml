name: Daily Crypto Price Fetch

on:
  schedule:
    # Run daily at 12:00 PM UTC (0 minutes, 12 hours)
    - cron: '0 12 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  fetch-crypto-prices:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Fetch cryptocurrency prices
      run: python fetch_crypto_prices.py
    
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
    
    - name: Commit and push changes
      run: |
        # Check if there are any changes to commit
        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Add all changed files (JSON files and README)
        git add .

        # Create a commit with the current date
        git commit -m "Daily crypto prices update - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

        # Push the commit to the repository
        git push origin main

        echo "Changes committed and pushed successfully"